[project]
name = "pop-settings"
version = "0.1.0"
description = "Central de Configurações Pop COSMIC para GNOME Shell 48"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pop-settings = "pop_settings.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pop_settings"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# PyGObject, GTK4 and Libadwaita come from the distribution (python3-gi,
# gir1.2-gtk-4.0, gir1.2-adw-1), never from PyPI. uv must therefore run the
# project on the system interpreter rather than downloading its own, which
# would not see the system site-packages where `gi` lives.
python-preference = "only-system"
