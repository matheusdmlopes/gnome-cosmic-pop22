[project]
name = "pop-settings"
version = "0.1.0"
description = "Central de Configurações Pop COSMIC para GNOME Shell 48"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pop-settings = "pop_settings.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pop_settings"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
